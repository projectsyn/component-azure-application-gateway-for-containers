parameters:
  azure_application_gateway_for_containers:
    =_metadata:
      multi_tenant: true
    namespace: syn-alb

    alb:
      subscription_id: null
      resource_group: null
      name: null
      frontend: default

    gateway:
      name: default
      allowedListeners:
        namespaces:
          from: All
      listeners:
        http:
          port: 80
          protocol: HTTP
          allowedRoutes:
            namespaces:
              from: All
